name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check repository hygiene
        shell: pwsh
        run: |
          $privateFiles = @(git ls-files AGENTS.md agent_memory docs/begin)
          if ($privateFiles.Count -gt 0) {
            throw "Local-only files are tracked: $($privateFiles -join ', ')"
          }

      - name: Check branch and commit naming
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          $branchPattern = '^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)/[a-z0-9]+(?:-[a-z0-9]+)*$'
          $subjectPattern = '^(feat|fix|docs|test|refactor|perf|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+$'

          if ($env:HEAD_BRANCH -notmatch $branchPattern) {
            throw "Invalid branch name: $env:HEAD_BRANCH"
          }
          if ($env:PR_TITLE -notmatch $subjectPattern) {
            throw "Invalid PR title: $env:PR_TITLE"
          }

          $subjects = @(git log --format=%s "$env:BASE_SHA..$env:HEAD_SHA")
          $invalidSubjects = @($subjects | Where-Object { $_ -notmatch $subjectPattern })
          if ($invalidSubjects.Count -gt 0) {
            throw "Invalid commit subjects: $($invalidSubjects -join '; ')"
          }

          git diff --check "$env:BASE_SHA..$env:HEAD_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore
        shell: pwsh
        run: dotnet restore .\GuraFile.slnx

      - name: Build
        shell: pwsh
        run: dotnet build .\GuraFile.slnx --configuration Release --no-restore

      - name: Test
        shell: pwsh
        run: dotnet test .\tests\GuraFile.Tests\GuraFile.Tests.csproj --configuration Release --no-build

      - name: Launch smoke
        shell: pwsh
        run: .\tests\LaunchSmoke.ps1 -Configuration Release -RuntimeIdentifier win-x64
